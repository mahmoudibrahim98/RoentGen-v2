# Option to specify a cache directory where downloaded models will be stored
# cache_dir: ".cache"

# Seed for reproducibility
seed: 873

# Whether to load dataset from wds instead of image/prompt directories
use_wds_dataset: True
url_root: "/content/RoentGen-v2/demo_data/demo_webdataset"
data_filter_file: null

# If use_wds_dataset is False, then use image_dir and prompt_dir
# image_dir: "/content/RoentGen-v2/demo_data/demo_datafiles/image_dir"
# prompt_dir: "/content/RoentGen-v2/demo_data/demo_datafiles/prompt_dir"

pretrained_model_name_or_path: "stabilityai/stable-diffusion-2-1-base"
pretrained_text_encoder_name_or_path: null
train_text_encoder: True

resolution: 512
embedding_method: "last_hidden_state"
enforce_tokenizer_max_sentence_length: 77
gradient_accumulation_steps: 1
lr_scheduler: "cosine"
mixed_precision: bf16
lr_warmup_steps: 500
learning_rate: 1.0e-5

# train batch size per GPU
train_batch_size: 4 #48
max_train_steps: 2 #60000
output_dir: "/content/RoentGen-v2/outputs"

checkpointing_steps: 1 #500
resume_from_checkpoint: "latest"

# ====== Hierarchical Conditioner Network (HCN) Settings ======
# Enable HCN for compositional demographic learning
use_hcn: True
# HCN architecture parameters
hcn_d_node: 256          # Hidden dimension for embeddings
hcn_d_ctx: 1024          # Output dimension (must match text encoder: 1024 for SD 2.1)
hcn_dropout: 0.1         # Dropout in MLPs
hcn_use_uncertainty: True  # Enable uncertainty quantification
# Demographic categories
hcn_num_age_bins: 5      # [0-18, 18-40, 40-60, 60-80, 80+]
hcn_num_sex: 2           # [Male, Female]
hcn_num_race: 4          # [White, Black, Asian, Hispanic]
# Training losses
hcn_kl_weight: 0.001     # Weight for KL divergence (uncertainty regularization)
hcn_kl_anneal_steps: 10000  # Steps to anneal KL weight from 0 to target
hcn_comp_weight: 0.01    # Weight for compositional consistency loss
